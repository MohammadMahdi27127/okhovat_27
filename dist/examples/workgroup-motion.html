<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>نمونهٔ حرکت کارت‌های کارگروه | اخوت</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f4;color:#1a2f2c;font:16px/1.8 Tahoma,sans-serif}main{max-width:800px;padding:32px 18px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}h1{font-size:22px}button{color:white;background:#0f5c55;padding:9px 14px;border:0;border-radius:20px;font:inherit;cursor:pointer}workgroup-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px}article{background:white;border:1px solid #dce5e1;border-radius:18px;padding:24px;transform-origin:right center}h2{font-size:18px;color:#0f5c55;margin:0}p{margin:6px 0 0}
</style><script defer src="../workgroup-cards.js"></script></head>
<body><main><header><h1>نمونهٔ حرکت کارگروه‌ها</h1><button onclick="const cards=document.querySelector('workgroup-cards');cards.replaceWith(cards.cloneNode(true))">پخش دوباره</button></header>
<workgroup-cards>
<article data-workgroup="تربیت بدنی"><h2>تربیت بدنی</h2><p>برنامهٔ تمرین گروهی</p></article>
<article data-workgroup="مالی"><h2>مالی</h2><p>گزارش هزینه‌های ماه</p></article>
<article data-workgroup="آموزش"><h2>آموزش</h2><p>کارگاه مهارت‌آموزی</p></article>
<article data-workgroup="تدارکات"><h2>تدارکات</h2><p>تقسیم مسئولیت‌های برنامه</p></article>
</workgroup-cards></main></body></html>
